<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consulta Mantis</title>
    <!-- Incluindo o Bootstrap CSS -->
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
        }
        .form-container {
            max-width: 400px; /* Largura máxima do formulário */
            margin: 50px auto; /* Centraliza verticalmente */
            padding: 20px;
            border-radius: 8px;
            background-color: white; /* Fundo branco para o formulário */
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1); /* Sombra para dar profundidade */
        }
    </style>
</head>

<body>
    <div class="form-container">

        <form method="POST" action="{% url 'consulta_mantis' %}">
            {% csrf_token %}
            
            <div class="form-group">
                {{ form.issue_id }} <!-- Usando o widget com a classe já definida -->
                {% if form.issue_id.errors %}
                    <div class="text-danger">{{ form.issue_id.errors }}</div>
                {% endif %}
            </div>
            
            <button type="submit" class="btn btn-dark btn-block">Consultar</button>
        </form>
    </div>

    <!-- Incluindo o Bootstrap JS e dependências (opcional) -->
    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.9.2/dist/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
</body>

</html>
